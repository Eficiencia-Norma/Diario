---
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="max-width: 800px; margin: 40px auto; font-family: Georgia, serif; line-height: 1.6; padding: 0 20px;">
  <header style="text-align: center; margin-bottom: 40px;">
    <h1 style="font-size: 2.5rem; margin-bottom: 5px;">{{ site.title }}</h1>
    <p style="color: #555;">{{ site.description }}</p>
    <hr>
  </header>

  <main>
    <h2>Últimas Noticias</h2>
    {% for post in site.posts %}
      <article style="margin-bottom: 30px;">
        <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
        <p style="color: #777;"><small>{{ post.date | date: "%d/%m/%Y" }} — Por {{ post.author }}</small></p>
        <p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
      </article>
    {% endfor %}
  </main>
</body>
</html>
