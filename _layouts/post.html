<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="max-width: 800px; margin: 40px auto; font-family: Georgia, serif; line-height: 1.6; padding: 0 20px;">
  <p><a href="{{ '/' | relative_url }}">← Volver a la portada</a></p>
  <hr>
  <h1>{{ page.title }}</h1>
  <p style="color: #666;">Por <strong>{{ page.author }}</strong> | Fecha: {{ page.date | date: "%d/%m/%Y" }}</p>
  <hr>
  <div>
    {{ content }}
  </div>
</body>
</html>
