name: Auditor Senior de Calidad Web

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  auditoria_integral:
    name: Inspección QA de Imágenes, Sintaxis y Enlaces
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Auditor Senior
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys

          print("🛡️ [QA SENIOR]: Iniciando auditoría integral de Eficiencia & Norma...")

          errores = []
          advertencias = []
          archivos_auditados = 0

          # 1. Auditoría de Peso y Formato de Imágenes Reales
          if os.path.exists("assets/img"):
              for root, _, files in os.walk("assets/img"):
                  for file in files:
                      fpath = os.path.join(root, file)
                      size_mb = os.path.getsize(fpath) / (1024 * 1024)
                      if size_mb > 3.0:
                          advertencias.append(f"⚠️ Imagen pesada: '{fpath}' ({size_mb:.2f} MB).")
                      
                      # Corrección de la tupla: tomar el índice [1] para la extensión
                      _, ext = os.path.splitext(file)
                      ext = ext.lower()
                      if ext not in ['.jpg', '.jpeg', '.png', '.webp', '.svg', '.gif']:
                          advertencias.append(f"⚠️ Formato no estándar: '{fpath}' con extensión '{ext}'.")

          # 2. Rutas a inspeccionar: solo contenido publicado para evitar falsos positivos
          rutas_inspeccionar = ["index.html", "_posts"]

          patron_if = re.compile(r'\{%\s*if\b')
          patron_endif = re.compile(r'\{%\s*endif\s*%\}')

          for ruta in rutas_inspeccionar:
              if not os.path.exists(ruta):
                  continue
              
              if os.path.isfile(ruta):
                  archivos = [ruta]
              else:
                  archivos = [os.path.join(root, f) for root, _, fs in os.walk(ruta) for f in fs if f.endswith(('.html', '.md'))]

              for filepath in archivos:
                  archivos_auditados += 1
                  with open(filepath, 'r', encoding='utf-8', errors='replace') as f:
                      contenido = f.read()

                  # A) Validar etiquetas Liquid pareadas
                  total_if = len(patron_if.findall(contenido))
                  total_endif = len(patron_endif.findall(contenido))
                  if total_if != total_endif:
                      errores.append(f"❌ Error Liquid en '{filepath}': {total_if} 'if' vs {total_endif} 'endif'.")

                  # B) Validar imágenes
                  md_imgs = re.findall(r'!\\[.*?\\]\\((.*?)\\)', contenido)
                  html_imgs = re.findall(r'<img[^>]+src=["\']([^"\']+)["\']', contenido)

                  for img in (md_imgs + html_imgs):
                      img = img.strip()
                      # Ignorar enlaces externos o variables de código/plantilla
                      if img.startswith(('http://', 'https://', 'data:', '//')) or any(c in img for c in ['{', '}', '\\', '$', '<', '>']):
                          continue

                      # Limpieza de prefijo de repositorio
                      clean_img = img.replace('/Diario/', '').replace('Diario/', '').lstrip('/')
                      clean_img = clean_img.split('?').split('#')[0]

                      if clean_img:
                          if not os.path.exists(clean_img):
                              errores.append(f"❌ Foto rota en '{filepath}': No existe el archivo '{clean_img}'.")

          # 3. Reporte de Resultados
          print("\n" + "="*50)
          print(f"📊 RESUMEN AUDITORÍA: {archivos_auditados} archivos de contenido inspeccionados")
          print("="*50)

          if advertencias:
              print("\n⚠️ ADVERTENCIAS DE RENDIMIENTO:")
              for adv in advertencias:
                  print(f"  - {adv}")

          if errores:
              print("\n🚨 ERRORES CRÍTICOS DETECTADOS:")
              for err in errores:
                  print(f"  - {err}")
              sys.exit(1)
          else:
              print("\n✅ ¡TODO IMPECABLE! Cero fotos rotas y cero errores de sintaxis.")
          EOF
