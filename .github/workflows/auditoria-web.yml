name: Bot Guardián - Auditoría de Errores y Web

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  auditar_sitio:
    name: Inspección de Enlaces, Fotos y Sintaxis
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Ruby para compilar Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Instalar Jekyll y herramientas de auditoría
        run: |
          gem install jekyll html-proofer

      - name: Compilar sitio web en entorno de prueba
        run: |
          bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Bot Auditor de Imágenes, Enlaces y Código
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys

          site_dir = "_site"
          errores = []
          advertencias = []

          print("🔍 [INSPECTOR WEB]: Iniciando escaneo profundo de la web...")

          # 1. Verificar peso de imágenes en assets/
          for root, _, files in os.walk("assets/img"):
              for file in files:
                  fpath = os.path.join(root, file)
                  size_mb = os.path.getsize(fpath) / (1024 * 1024)
                  if size_mb > 3.0:
                      advertencias.append(f"⚠️ Imagen pesada detectada: '{fpath}' ({size_mb:.2f} MB). Podría ralentizar la carga en celulares.")

          # 2. Verificar que cada imagen referenciada en el HTML realmente exista
          for root, _, files in os.walk(site_dir):
              for file in files:
                  if file.endswith(".html"):
                      html_path = os.path.join(root, file)
                      with open(html_path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      # Buscar rutas de imágenes src="..."
                      img_srcs = re.findall(r'<img[^>]+src=["\']([^"\']+)["\']', content)
                      for src in img_srcs:
                          # Ignorar enlaces externos completos (http/https) o emojis
                          if src.startswith("http://") or src.startswith("https://") or src.startswith("data:"):
                              continue
                          
                          # Limpiar rutas relativas con baseurl
                          clean_src = src.split("?")[0].split("#")[0]
                          clean_src = clean_src.replace("/Eficiencia-Norma-/", "").lstrip("/")
                          local_target = os.path.join(site_dir, clean_src)

                          if not os.path.exists(local_target):
                              errores.append(f"❌ FOTO ROTA: En '{file}' la imagen '{src}' no existe en el servidor.")

                      # 3. Detectar etiquetas rotas o texto crudo sin procesar
                      if re.search(r'(\{%|\{\{)', content):
                          errores.append(f"❌ CÓDIGO CRUDAJE: Se detectaron etiquetas Liquid sin compilar en '{file}'.")

          print("\n--- REPORTE FINAL DEL BOT GUARDIÁN ---")
          if advertencias:
              for adv in advertencias:
                  print(adv)

          if errores:
              print("\n🚨 SE DETECTARON ERRORES CRÍTICOS QUE DEBEN CORREGIRSE:")
              for err in errores:
                  print(err)
              # Salir con error para alertar en la pestaña Actions
              sys.exit(1)
          else:
              print("✅ [TODO PERFECTO]: No hay fotos rotas, enlaces huérfanos ni errores de plantilla.")
          EOF
