name: Publicador Editorial con Auditor de Calidad

on:
  push:
    paths:
      - '_borradores/**'
  workflow_dispatch:

jobs:
  auditar_y_publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar librerías de conversión y ortografía
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils
          pip install python-docx pypdf pillow pyspellchecker

      - name: Bot Auditor de Calidad y Procesador
        run: |
          python3 - << 'EOF'
          import os
          import re
          import shutil
          import subprocess
          from datetime import date
          from spellchecker import SpellChecker

          # Inicializar corrector en español
          spell = SpellChecker(language='es')
          # Palabras técnicas habituales de libre competencia para no marcarlas como error
          terminos_legales = {'tdlc', 'fne', 'cencosud', 'cartel', 'carteles', 'colusion', 'post', 'markdown', 'docx', 'pdf', 'online', 'ranking', 'lead'}
          spell.word_frequency.load_words(terminos_legales)

          borradores_dir = "_borradores"
          posts_dir = "_posts"
          img_base_dir = "assets/img"
          docs_base_dir = "assets/docs"

          os.makedirs(posts_dir, exist_ok=True)
          os.makedirs(img_base_dir, exist_ok=True)
          os.makedirs(docs_base_dir, exist_ok=True)

          today_str = date.today().strftime("%Y-%m-%d")

          archivos = [f for f in os.listdir(borradores_dir) if os.path.isfile(os.path.join(borradores_dir, f)) and not f.endswith(('.txt', '.gitkeep', 'LEEME'))]

          if not archivos:
              print("No hay borradores nuevos para auditar.")
              exit(0)

          for filename in archivos:
              print(f"--- Auditando documento: {filename} ---")
              filepath = os.path.join(borradores_dir, filename)
              base_name, ext = os.path.splitext(filename)
              ext = ext.lower().replace('.', '')

              clean_slug = re.sub(r'[^a-zA-Z0-9]+', '-', base_name.lower()).strip('-')
              clean_title = base_name.replace('-', ' ').replace('_', ' ').strip().title()

              post_filename = f"{today_str}-{clean_slug}.md"
              post_path = os.path.join(posts_dir, post_filename)
              article_img_dir = os.path.join(img_base_dir, clean_slug)
              os.makedirs(article_img_dir, exist_ok=True)

              cuerpo_markdown = ""

              # 1. Extracción según formato
              if ext == "docx":
                  media_temp = os.path.join("/tmp", f"media_{clean_slug}")
                  os.makedirs(media_temp, exist_ok=True)
                  cmd = ["pandoc", filepath, "-f", "docx", "-t", "gfm-raw_html", f"--extract-media={media_temp}", "--wrap=none"]
                  res = subprocess.run(cmd, capture_output=True, text=True)
                  cuerpo_markdown = res.stdout

                  # Extraer y conectar imágenes
                  extracted_folder = os.path.join(media_temp, "media")
                  if os.path.exists(extracted_folder):
                      for img_file in os.listdir(extracted_folder):
                          shutil.copy2(os.path.join(extracted_folder, img_file), os.path.join(article_img_dir, img_file))
                  
                  cuerpo_markdown = re.sub(
                      r'!\\[(.*?)\\]\\([^)]*media/([^)]+)\\)',
                      rf'![\1]({{{{ site.baseurl }}}}/assets/img/{clean_slug}/\2)',
                      cuerpo_markdown
                  )

              elif ext == "pdf":
                  shutil.copy2(filepath, os.path.join(docs_base_dir, f"{today_str}-{clean_slug}.pdf"))
                  subprocess.run(["pdfimages", "-png", filepath, os.path.join(article_img_dir, "img")], capture_output=True)
                  txt_res = subprocess.run(["pdftotext", "-layout", filepath, "-"], capture_output=True, text=True)
                  raw_lines = [l.strip() for l in txt_res.stdout.splitlines() if not re.match(r'^(Página\s+\d+|\d+)$', l.strip())]
                  cuerpo_markdown = "\n\n".join([p for p in "\n".join(raw_lines).split("\n\n") if p.strip()])
                  cuerpo_markdown += f"\n\n---\n\n> 📥 **[Descargar documento original en PDF]({{{{ site.baseurl }}}}/assets/docs/{today_str}-{clean_slug}.pdf)**\n"

              # 2. FILTRO ANTI-CÓDIGO BASURA (Limpia caracteres de control y XML roto)
              cuerpo_markdown = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', '', cuerpo_markdown)
              cuerpo_markdown = re.sub(r'<\/?(span|div|font|style|o:p)[^>]*>', '', cuerpo_markdown)

              # 3. AUDITORÍA ORTOGRÁFICA PREVENTIVA
              palabras = re.findall(r'\b[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]{4,}\b', cuerpo_markdown.lower())
              desconocidas = spell.unknown(palabras)
              if desconocidas:
                  print(f"⚠️ [AVISO DE CALIDAD]: Se detectaron {len(desconocidas)} palabras dudosas o posibles erratas: {list(desconocidas)[:8]}")
              else:
                  print("✅ [CONTROL ORTOGRÁFICO]: Documento sin errores ortográficos comunes detectados.")

              # 4. Inyección de Front Matter Editorial
              front_matter = f"""---
layout: post
title: "{clean_title}"
author: "Equipo Editorial"
date: {today_str}
category: "Coyuntura & Regulación"
---

"""
              with open(post_path, "w", encoding="utf-8") as f:
                  f.write(front_matter + cuerpo_markdown.strip() + "\n")

              os.remove(filepath)
              print(f"✅ Publicación completada con éxito: {post_filename}")
          EOF

      - name: Publicar cambios limpios
        run: |
          git config --global user.name "Bot Eficiencia & Norma"
          git config --global user.email "bot@eficiencia-norma.cl"
          git add _posts/ assets/ _borradores/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Publicación auditada y depurada" && git push)
