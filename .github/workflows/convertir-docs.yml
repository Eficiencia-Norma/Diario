name: Publicador Universal Optimizado

on:
  push:
    paths:
      - '_borradores/**'
  workflow_dispatch:

jobs:
  procesar_documentos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python y herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils
          pip install python-docx pypdf pillow

      - name: Procesador Editorial Blindado (Limpia códigos y conecta imágenes)
        run: |
          python3 - << 'EOF'
          import os
          import re
          import shutil
          import subprocess
          from datetime import date

          borradores_dir = "_borradores"
          posts_dir = "_posts"
          img_base_dir = "assets/img"
          docs_base_dir = "assets/docs"

          os.makedirs(posts_dir, exist_ok=True)
          os.makedirs(img_base_dir, exist_ok=True)
          os.makedirs(docs_base_dir, exist_ok=True)

          today_str = date.today().strftime("%Y-%m-%d")

          if not os.path.exists(borradores_dir):
              print("No existe _borradores")
              exit(0)

          archivos = [f for f in os.listdir(borradores_dir) if os.path.isfile(os.path.join(borradores_dir, f)) and not f.endswith(('.txt', '.gitkeep', 'LEEME'))]

          for filename in archivos:
              filepath = os.path.join(borradores_dir, filename)
              base_name, ext = os.path.splitext(filename)
              ext = ext.lower().replace('.', '')

              # Crear slug limpio
              clean_slug = re.sub(r'[^a-zA-Z0-9]+', '-', base_name.lower()).strip('-')
              clean_title = base_name.replace('-', ' ').replace('_', ' ').strip().title()

              post_filename = f"{today_str}-{clean_slug}.md"
              post_path = os.path.join(posts_dir, post_filename)
              article_img_dir = os.path.join(img_base_dir, clean_slug)
              os.makedirs(article_img_dir, exist_ok=True)

              cuerpo_markdown = ""

              # CASO 1: DOCX (Google Docs o Word con fotos adentro)
              if ext == "docx":
                  media_temp = os.path.join("/tmp", f"media_{clean_slug}")
                  os.makedirs(media_temp, exist_ok=True)
                  # Extraer texto limpio a markdown sin basuras
                  cmd = [
                      "pandoc", filepath,
                      "-f", "docx",
                      "-t", "gfm-raw_html",  # Elimina HTML roto
                      f"--extract-media={media_temp}",
                      "--wrap=none"
                  ]
                  res = subprocess.run(cmd, capture_output=True, text=True)
                  cuerpo_markdown = res.stdout

                  # Mover imágenes extraídas y reescribir rutas
                  extracted_folder = os.path.join(media_temp, "media")
                  if os.path.exists(extracted_folder):
                      for img_file in os.listdir(extracted_folder):
                          src = os.path.join(extracted_folder, img_file)
                          dst = os.path.join(article_img_dir, img_file)
                          shutil.copy2(src, dst)

                  # Normalizar rutas de imágenes en el texto
                  cuerpo_markdown = re.sub(
                      r'!\\[(.*?)\\]\\([^)]*media/([^)]+)\\)',
                      rf'![\1]({{{{ site.baseurl }}}}/assets/img/{clean_slug}/\2)',
                      cuerpo_markdown
                  )

              # CASO 2: PDF
              elif ext == "pdf":
                  # Guardar copia del PDF original para descarga
                  pdf_dest = os.path.join(docs_base_dir, f"{today_str}-{clean_slug}.pdf")
                  shutil.copy2(filepath, pdf_dest)

                  # Extraer imágenes del PDF
                  subprocess.run(["pdfimages", "-png", filepath, os.path.join(article_img_dir, "img")], capture_output=True)

                  # Extraer texto plano
                  txt_res = subprocess.run(["pdftotext", "-layout", filepath, "-"], capture_output=True, text=True)
                  raw_text = txt_res.stdout

                  # Limpiar caracteres raros y saltos repetidos
                  cleaned_lines = []
                  for line in raw_text.splitlines():
                      l = line.strip()
                      # Ignorar numeración de pie de página suelta o basura binaria
                      if re.match(r'^(Página\s+\d+|\d+)$', l):
                          continue
                      cleaned_lines.append(l)

                  cuerpo_markdown = "\n\n".join([p for p in "\n".join(cleaned_lines).split("\n\n") if p.strip()])

                  # Agregar botón de descarga estilizado
                  cuerpo_markdown += f"\n\n---\n\n> 📥 **[Descargar documento original en PDF]({{{{ site.baseurl }}}}/assets/docs/{today_str}-{clean_slug}.pdf)**\n"

              # CASO 3: ARCHIVOS DE TEXTO PLANO
              elif ext in ["md", "txt"]:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      cuerpo_markdown = f.read()

              # Filtrar códigos o etiquetas no deseadas
              cuerpo_markdown = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', '', cuerpo_markdown)

              # Construir cabecera Front Matter impecable
              front_matter = f"""---
layout: post
title: "{clean_title}"
author: "Equipo Editorial"
date: {today_str}
category: "Coyuntura & Regulación"
---

"""
              with open(post_path, "w", encoding="utf-8") as f:
                  f.write(front_matter + cuerpo_markdown.strip() + "\n")

              # Eliminar borrador ya procesado
              os.remove(filepath)
              print(f"Procesado exitosamente: {filename} -> {post_filename}")
          EOF

      - name: Confirmar y publicar cambios
        run: |
          git config --global user.name "Bot Eficiencia & Norma"
          git config --global user.email "bot@eficiencia-norma.cl"
          git add _posts/ assets/ _borradores/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Publicación optimizada con limpieza de texto e imágenes" && git push)
