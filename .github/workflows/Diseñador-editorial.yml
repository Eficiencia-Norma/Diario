name: Disenador Editorial

on:
  push:
    paths:
      - '_borradores/**'
  workflow_dispatch:

jobs:
  maquetar_publicaciones:
    name: Procesar Borradores y Publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas de conversión
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils

      - name: Ejecutar Maquetador Editorial
        run: |
          python3 procesar_publicaciones.py

      - name: Publicar cambios en el repositorio
        run: |
          git config --global user.name "Bot Eficiencia & Norma"
          git config --global user.email "bot@eficiencia-norma.cl"
          git add _posts/ assets/ _borradores/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Publicación maquetada con gráficos y multimedia" && git push)

      - name: Publicar cambios en el repositorio
        run: |
          git config --global user.name "Bot Eficiencia & Norma"
          git config --global user.email "bot@eficiencia-norma.cl"
          # Asegurar que Git capture tanto los posts como todas las imágenes nuevas
          git add _posts/ assets/ _borradores/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Publicación maquetada con imágenes y gráficos" && git push)
